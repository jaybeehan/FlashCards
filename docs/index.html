<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<meta name="description" content="Study Alberta Grade 9-12 flash cards offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Alberta Flash Cards</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#17202e;--muted:#5d6878;--line:#c9d1e0;--accent:#0b5fff;--accent-text:#fff;
  --ok:#1a8f4c;--warn:#c2410c;--back:#e8f0ff}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--panel:#1a2230;--text:#eef2f9;--muted:#9aa6ba;--line:#33405a;
  --accent:#4d8dff;--accent-text:#06142e;--ok:#35b86c;--warn:#f08a4b;--back:#1d2c4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px 0 32px}
h1{font-size:1.5rem;margin:.4rem 0 1rem}
label{display:block;margin-top:14px;font-weight:600;font-size:.95rem}
select,input[type=number]{width:100%;margin-top:6px;padding:12px;font-size:1rem;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;margin-top:16px}
.check input{width:22px;height:22px}
small,.muted{color:var(--muted);font-weight:400}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px;width:100%;margin-top:14px;font-weight:600;
  background:var(--accent);color:var(--accent-text)}
button.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
button.ghost{background:transparent;color:var(--muted);font-weight:500;width:auto;padding:8px 10px;margin-top:6px}
button:disabled{opacity:.45}
.row{display:flex;gap:12px}.row button{flex:1}
button.ok{background:var(--ok);color:#fff}button.warn{background:var(--warn);color:#fff}
#study{display:flex;flex-direction:column;min-height:calc(100dvh - 48px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.meter div{height:100%;width:0;background:var(--accent);transition:width .25s}
#card{flex:1;min-height:260px;max-height:62vh;background:var(--panel);border:2px solid var(--line);border-radius:18px;
  padding:18px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;transition:transform .12s,background .15s}
#card.back{background:var(--back);border-color:var(--accent)}
#card.pop{transform:scale(.985)}
#ctext{font-size:1.35rem;line-height:1.45;overflow-y:auto;max-height:100%;padding:8px 0;word-break:break-word}
#clabel,#chint{font-size:.8rem;color:var(--muted)}
.keys{margin-top:12px;text-align:center;font-size:.8rem;color:var(--muted)}
#loading{padding:40px 0;text-align:center;color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<div id="loading">Loading cards...</div>

<section id="setup" class="hide">
  <h1>Alberta Flash Cards</h1>
  <label>Grade<select id="grade"></select></label>
  <label>Subject<select id="subject"></select></label>
  <label>Course<select id="course"></select></label>
  <label>Unit<select id="unit"></select></label>
  <label>Number of cards <small id="avail"></small>
    <input type="number" id="count" inputmode="numeric" min="1" value="20"></label>
  <label class="check"><input type="checkbox" id="skip" checked> Skip cards I've already mastered</label>
  <button id="start">Start studying</button>
  <button class="alt hide" id="install">Install app on this phone</button>
  <p class="muted" id="masterNote"></p>
  <button class="ghost" id="reset">Reset mastered cards</button>
  <p class="muted" id="tip">Works offline once loaded. In Chrome: menu, then "Add to Home screen".</p>
</section>

<section id="study" class="hide">
  <div class="bar"><span id="prog" class="muted"></span><button class="ghost" id="exit">Exit</button></div>
  <div class="meter"><div id="fill"></div></div>
  <div id="card" tabindex="0" role="button" aria-label="Flash card, tap to flip">
    <span id="clabel"></span>
    <div id="ctext"></div>
    <span id="chint">Tap the card to flip</span>
  </div>
  <div class="row"><button class="warn" id="again">Review again</button><button class="ok" id="know">Got it</button></div>
  <button class="alt" id="shuf">Shuffle remaining</button>
  <p class="keys">Swipe right = got it, swipe left = review again</p>
</section>

<section id="done" class="hide">
  <h1>Nice work!</h1>
  <p id="summary"></p>
  <button id="again2">Study another set</button>
  <button class="alt" id="back2">Back to menu</button>
</section>
</main>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var CORE = 'Core Subjects (mixed)', ALL = 'All units';
var CORE_SUBJECTS = ['Mathematics', 'Science', 'Social Studies', 'English Language Arts'];
var D = null, queue = [], total = 0, learned = 0, rounds = 0, flipped = false, lastSet = 0, installEvent = null;

function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var known = lsGet('abfc.known', {});

function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fill(el, items, keep) {
  el.innerHTML = '';
  items.forEach(function (v) { var o = document.createElement('option'); o.textContent = v; el.appendChild(o); });
  if (keep && items.indexOf(keep) >= 0) el.value = keep;
}
function show(id) { ['loading', 'setup', 'study', 'done'].forEach(function (s) { $(s).classList.toggle('hide', s !== id); }); window.scrollTo(0, 0); }

// ---------------------------------------------------------------- selection
function unitsOf(g, course) {
  var subs = D.curr[g];
  for (var s in subs) if (course in subs[s]) return subs[s][course];
  return [];
}
function selection() {
  var g = $('grade').value, s = $('subject').value, c = $('course').value, u = $('unit').value, pairs = [];
  if (s === CORE) {
    CORE_SUBJECTS.forEach(function (sub) {
      var cs = D.curr[g][sub] || {};
      Object.keys(cs).forEach(function (co) { cs[co].forEach(function (un) { pairs.push([co, un]); }); });
    });
  } else if (u === ALL) {
    unitsOf(g, c).forEach(function (un) { pairs.push([c, un]); });
  } else pairs.push([c, u]);
  return pairs.map(function (p) { return { label: p[0] + ' · ' + p[1], cards: D.pools[D.map[p[0] + '|' + p[1]]] || [] }; });
}
function counts() {
  var seen = {}, avail = 0, mastered = 0;
  selection().forEach(function (p) {
    p.cards.forEach(function (c) {
      var h = hash(c[0]);
      if (seen[h]) return;
      seen[h] = 1; avail++;
      if (known[h]) mastered++;
    });
  });
  return { avail: avail, mastered: mastered };
}
function updateCounts() {
  var n = counts();
  $('avail').textContent = '(' + n.avail + ' available)';
  $('masterNote').textContent = n.mastered ? n.mastered + ' of these cards are marked as mastered.' : '';
  $('count').max = Math.max(n.avail, 1);
  if (+$('count').value > n.avail) $('count').value = Math.max(n.avail, 1);
}
function onGrade(keep) {
  fill($('subject'), [CORE].concat(Object.keys(D.curr[$('grade').value])), keep && keep.subject);
  onSubject(keep);
}
function onSubject(keep) {
  var g = $('grade').value, s = $('subject').value;
  if (s === CORE) { fill($('course'), ['All core courses']); fill($('unit'), [ALL]); updateCounts(); return; }
  fill($('course'), Object.keys(D.curr[g][s]), keep && keep.course);
  onCourse(keep);
}
function onCourse(keep) {
  var g = $('grade').value, s = $('subject').value;
  if (s !== CORE) fill($('unit'), [ALL].concat(unitsOf(g, $('course').value)), keep && keep.unit);
  updateCounts();
}

function buildDeck(count, skip) {
  var pools = selection().map(function (p) {
    return { label: p.label, cards: shuffle(p.cards.filter(function (c) { return !skip || !known[hash(c[0])]; })) };
  }).filter(function (p) { return p.cards.length; });
  var out = [], seen = {};
  while (pools.length && out.length < count) {
    for (var i = 0; i < pools.length && out.length < count; i++) {
      var p = pools[i], c = p.cards.shift(), h = hash(c[0]);
      if (!seen[h]) { seen[h] = 1; out.push({ front: c[0], back: c[1], label: p.label, h: h }); }
      if (!p.cards.length) { pools.splice(i, 1); i--; }
    }
  }
  return shuffle(out);
}

// ---------------------------------------------------------------- study
function render() {
  if (!queue.length) return finish();
  var c = queue[0];
  $('card').classList.toggle('back', flipped);
  $('clabel').textContent = flipped ? 'Answer' : c.label;
  $('ctext').textContent = flipped ? c.back : c.front;
  $('chint').textContent = flipped ? ' ' : 'Tap the card to flip';
  $('prog').textContent = learned + ' of ' + total + ' learned';
  $('fill').style.width = (total ? learned / total * 100 : 0) + '%';
  $('card').setAttribute('aria-label', (flipped ? 'Answer: ' : 'Question: ') + $('ctext').textContent);
}
function flip() {
  if (!queue.length) return;
  flipped = !flipped;
  var card = $('card'); card.classList.add('pop');
  setTimeout(function () { card.classList.remove('pop'); }, 120);
  render();
}
function grade(gotIt) {
  if (!queue.length) return;
  var c = queue.shift();
  if (gotIt) { learned++; known[c.h] = 1; lsSet('abfc.known', known); } else { queue.push(c); rounds++; }
  flipped = false;
  render();
}
function finish() {
  $('summary').textContent = 'You learned all ' + total + ' cards' + (rounds ? ' and reviewed ' + rounds + ' card' + (rounds === 1 ? '' : 's') + ' again.' : ' on the first try!');
  show('done');
}
function start() {
  var count = Math.max(1, parseInt($('count').value, 10) || 20);
  var deck = buildDeck(count, $('skip').checked);
  if (!deck.length) {
    var n = counts();
    alert(n.avail && n.mastered === n.avail ? 'You have mastered every card here! Untick "Skip cards I\'ve already mastered" or reset mastered cards to study them again.' : 'No cards found for that choice.');
    return;
  }
  lsSet('abfc.sel', { grade: $('grade').value, subject: $('subject').value, course: $('course').value, unit: $('unit').value, count: count, skip: $('skip').checked });
  queue = deck; total = deck.length; learned = 0; rounds = 0; flipped = false;
  show('study'); render();
}

// ---------------------------------------------------------------- events
function wire() {
  $('grade').onchange = function () { onGrade(); };
  $('subject').onchange = function () { onSubject(); };
  $('course').onchange = function () { onCourse(); };
  $('unit').onchange = updateCounts;
  $('start').onclick = start;
  $('card').onclick = function () { if (Date.now() - lastSet > 250) flip(); };
  $('know').onclick = function () { grade(true); };
  $('again').onclick = function () { grade(false); };
  $('shuf').onclick = function () { shuffle(queue); flipped = false; render(); };
  $('exit').onclick = function () { show('setup'); updateCounts(); };
  $('again2').onclick = function () { show('setup'); updateCounts(); };
  $('back2').onclick = function () { show('setup'); updateCounts(); };
  $('reset').onclick = function () {
    if (confirm('Forget which cards you have mastered?')) { known = {}; lsSet('abfc.known', known); updateCounts(); }
  };
  document.addEventListener('keydown', function (e) {
    if ($('study').classList.contains('hide')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    else if (e.key === 'ArrowRight') grade(true);
    else if (e.key === 'ArrowLeft') grade(false);
  });
  // swipe: right = got it, left = review again
  var x0 = null, y0 = null;
  $('card').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  $('card').addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) { lastSet = Date.now(); grade(dx > 0); }
  });
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); installEvent = e; $('install').classList.remove('hide'); $('tip').classList.add('hide');
  });
  $('install').onclick = function () {
    if (!installEvent) return;
    installEvent.prompt(); installEvent = null; $('install').classList.add('hide');
  };
  window.addEventListener('appinstalled', function () { $('install').classList.add('hide'); });
}

function init() {
  var saved = lsGet('abfc.sel', null) || {};
  fill($('grade'), Object.keys(D.curr), saved.grade);
  fill($('subject'), [CORE].concat(Object.keys(D.curr[$('grade').value])), saved.subject);
  onSubject(saved);
  if (saved.count) $('count').value = saved.count;
  if (saved.skip === false) $('skip').checked = false;
  updateCounts();
  wire();
  show('setup');
}

fetch('cards.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
  D = d; init();
}).catch(function () {
  $('loading').textContent = 'Could not load the cards. Connect to the internet once, then try again.';
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
</script>
</body>
</html>
